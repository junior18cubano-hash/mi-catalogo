 <path d="M35 100l145 55v190L35 290z" fill="#13253f" stroke="#5c779e" stroke-width="3"/>
 <path d="M55 130l100 38v8l-100-38zM55 155l100 38v8l-100-38z" fill="#51e4f7" opacity=".6"/>
