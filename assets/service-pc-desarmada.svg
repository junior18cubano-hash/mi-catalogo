<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">Mantenimiento de PC con componentes desarmados</title><desc id="d">Una computadora de escritorio se desarma creativamente en el aire: carcasa abierta, placa base, ventiladores, memoria, tarjeta gráfica, cables y tornillos flotando en una composición tecnológica.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset=".5" stop-color="#12284a"/><stop offset="1" stop-color="#17112d"/></linearGradient>
 <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#c8d8ed"/><stop offset=".4" stop-color="#526987"/><stop offset="1" stop-color="#1a2b46"/></linearGradient>
 <linearGradient id="cyan" x2="1"><stop stop-color="#41eaff"/><stop offset="1" stop-color="#8c78ff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="600" fill="url(#bg)"/>
<circle cx="600" cy="300" r="250" fill="#32cfff" opacity=".15" filter="url(#glow)"/>
<g fill="none" stroke="#5ceaff" opacity=".3"><path d="M40 110h170l35 35h90M900 80h180l35 35h45M65 490h160l35-35h95M930 500h160l35-35h45"/></g>
